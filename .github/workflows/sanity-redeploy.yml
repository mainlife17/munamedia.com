name: Sanity Content Redeploy

on:
  repository_dispatch:
    types: [sanity-content-published]
  workflow_dispatch:
    inputs:
      reason:
        description: Why redeploy the site?
        required: false
        default: Manual content redeploy

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  redeploy:
    name: Rebuild from Sanity and deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "event_type=${{ github.event.action }}"
          echo "reason=${{ github.event.inputs.reason || github.event.client_payload.reason || 'Sanity content published' }}"
          echo "sanity_project=${{ github.event.client_payload.projectId || 'not provided' }}"
          echo "sanity_dataset=${{ github.event.client_payload.dataset || 'not provided' }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: |
          rm -rf public/studio public/static .sanity-build dist
          npm run check

      - name: Build site and Studio
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || 'eulrkmkt' }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}

      - name: Audit generated site
        run: npm run audit:dist

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
